syntax = "proto3";
package alpha.authzattrs.v1;

import "alpha/authzattrs/v1/params.proto";
import "alpha/authzattrs/v1/authorization.proto";
import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "alpha/x/authzattrs/types";

// CurrentIssuerSetSelection selects the current issuer set for one policy scope.
message CurrentIssuerSetSelection {
  string policy_id = 1;
  string msg_type_url = 2;
  uint64 issuer_set_id = 3;
}

// LastAppliedBatchID stores replay state for one issuer set.
message LastAppliedBatchID {
  uint64 issuer_set_id = 1;
  uint64 batch_id = 2;
}

// GenesisState defines the authzattrs module genesis state.
message GenesisState {
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  repeated AuthorizationRecord authorizations = 2 [(gogoproto.nullable) = false];
  repeated IssuerSet issuer_sets = 3 [(gogoproto.nullable) = false];
  repeated Issuer issuers = 4 [(gogoproto.nullable) = false];
  repeated CurrentIssuerSetSelection current_issuer_sets = 5 [(gogoproto.nullable) = false];
  repeated LastAppliedBatchID last_applied_batch_ids = 6 [(gogoproto.nullable) = false];
}
