syntax = "proto3";
package alpha.authzattrs.v1;

import "alpha/authzattrs/v1/params.proto";
import "alpha/authzattrs/v1/authorization.proto";
import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";

option go_package = "alpha/x/authzattrs/types";

// Query defines the authzattrs query service.
service Query {
  // Params queries the module parameters.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/alpha/authzattrs/v1/params";
  }

  // Authorization queries the current authorization for a logical key.
  rpc Authorization(QueryAuthorizationRequest) returns (QueryAuthorizationResponse) {
    option (google.api.http).get = "/alpha/authzattrs/v1/authorizations/{subject}";
  }

  // CurrentIssuerSet queries the current issuer set for a policy and message type.
  rpc CurrentIssuerSet(QueryCurrentIssuerSetRequest) returns (QueryCurrentIssuerSetResponse) {
    option (google.api.http).get = "/alpha/authzattrs/v1/current-issuer-sets/{policy_id}";
  }

  // LastAppliedBatchID queries replay state for an issuer set.
  rpc LastAppliedBatchID(QueryLastAppliedBatchIDRequest) returns (QueryLastAppliedBatchIDResponse) {
    option (google.api.http).get = "/alpha/authzattrs/v1/last-applied-batch-ids/{issuer_set_id}";
  }
}

message QueryParamsRequest {}

message QueryParamsResponse {
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

message QueryAuthorizationRequest {
  string subject = 1;
  string msg_type_url = 2;
}

message QueryAuthorizationResponse {
  bool found = 1;
  AuthorizationRecord authorization = 2 [(gogoproto.nullable) = false];
}

message QueryCurrentIssuerSetRequest {
  string policy_id = 1;
  string msg_type_url = 2;
}

message QueryCurrentIssuerSetResponse {
  bool found = 1;
  uint64 issuer_set_id = 2;
}

message QueryLastAppliedBatchIDRequest {
  uint64 issuer_set_id = 1;
}

message QueryLastAppliedBatchIDResponse {
  bool found = 1;
  uint64 batch_id = 2;
}
