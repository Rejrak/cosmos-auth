syntax = "proto3";
package alpha.authzattrs.module.v1;

import "cosmos/app/v1alpha1/module.proto";

option go_package = "alpha/x/authzattrs/types";

// Module is the config object for the authzattrs module.
message Module {
  option (cosmos.app.v1alpha1.module) = {go_import: "alpha/x/authzattrs"};

  // authority defines the module authority and defaults to governance.
  string authority = 1;
}
