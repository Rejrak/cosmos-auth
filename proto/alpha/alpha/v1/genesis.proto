syntax = "proto3";
package alpha.alpha.v1;

import "alpha/alpha/v1/params.proto";
import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "alpha/x/alpha/types";

// GenesisState defines the alpha module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}
